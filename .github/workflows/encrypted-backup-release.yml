name: Encrypted Repository Backup

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, e.g. backup-2026-10-26"
        required: true
        type: string
        default: "backup-2026-10-26"

permissions:
  contents: write

jobs:
  encrypted-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create AES-256 encrypted ZIP
        env:
          BACKUP_ZIP_PASSWORD: ${{ secrets.BACKUP_ZIP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BACKUP_ZIP_PASSWORD}" ]]; then
            echo "::error::Add BACKUP_ZIP_PASSWORD in Settings > Secrets and variables > Actions before running this workflow."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          mkdir -p /tmp/merzkava-backup
          rsync -a --exclude='.git/' --exclude='merzkava-universe-backup.zip' ./ /tmp/merzkava-backup/
          cd /tmp
          7z a -tzip -mem=AES256 "-p${BACKUP_ZIP_PASSWORD}" merzkava-universe-backup.zip merzkava-backup/
          test -s /tmp/merzkava-universe-backup.zip

      - name: Publish encrypted ZIP as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          gh release create "$TAG_NAME" /tmp/merzkava-universe-backup.zip \
            --title "Merzkava Universe Backup $TAG_NAME" \
            --notes "Password-protected AES-256 ZIP snapshot of the Merzkava Universe repository. Store the password separately; it is not included in this release."
