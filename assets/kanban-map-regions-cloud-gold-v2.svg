<svg xmlns="http://www.w3.org/2000/svg" width="300" height="700" viewBox="0 0 300 700" role="img" aria-labelledby="title">
<title id="title">Map and Regions — hanging archive plaque suspended from a Qiangliang-inspired mythic cloud-lion</title>
<defs>
