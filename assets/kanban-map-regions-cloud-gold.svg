 M160 53 C174 43 188 47 194 56 C199 64 191 70 185 65
 C181 62 185 58 189 61
 M183 82 C197 75 213 79 225 69 C220 84 207 91 191 91"
 fill="none" stroke="#E28B39" stroke-width="3.2"/>
 <path d="M123 91 l8 9 -8 9 -8 -9 Z" fill="#B84D37" stroke="#F0C77F" stroke-width="2.4"/>
 <circle cx="123" cy="100" r="3.3" fill="#FFF4D8"/>
</g>
<!-- One thick chain starts inside the cloud, then connects to one nail on the tilted plaque. -->
<g stroke-linecap="round" stroke-linejoin="round">
 <path d="M123 62 L145 181" fill="none" stroke="#080909" stroke-width="14"/>
 <path d="M120 63 L142 179" fill="none" stroke="#777" stroke-width="3"/>
