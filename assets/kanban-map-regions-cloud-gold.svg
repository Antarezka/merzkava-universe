 <path d="M81 75 C88 78 92 77 97 74 C102 78 108 78 116 74
 M83 83 C92 88 101 88 111 82"
 fill="none" stroke="#FFE6A3" stroke-width="2.6"/>
 <!-- Dense cloud scrolls form the lower mane and merge into wind ribbons. -->
 <path d="M25 77 C34 63 48 67 51 77 C54 87 43 91 37 84 C34 80 39 76 43 80
 M47 89 C54 75 69 77 72 88 C75 98 62 101 57 94
 M126 91 C128 77 143 75 149 85 C155 95 144 101 138 94
