 <path d="M23 63 C13 53 23 43 32 49 C39 54 34 63 28 60
 M34 34 C28 22 42 15 51 25 C58 32 51 41 44 37
 M63 25 C63 12 81 10 87 23 C91 32 83 39 76 33
 M99 31 C100 18 117 19 122 31 C126 41 116 46 109 39
 M137 45 C142 32 157 37 159 47 C161 56 151 61 145 54
 M170 64 C180 54 193 65 187 75 C183 82 174 79 176 73"
 fill="#FFD783" stroke="#A94E25" stroke-width="3"/>
 <!-- Lion-like face nested inside the cloud: brow, cheeks, muzzle and curled whisker-clouds. -->
 <path d="M69 48 C77 38 91 38 100 46 C109 37 123 41 130 51
 C138 62 131 77 121 82 C112 91 96 91 88 82 C75 79 65 64 69 48 Z"
 fill="#F4BD61" stroke="#8B3D21" stroke-width="2.8"/>
