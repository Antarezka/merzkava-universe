<svg xmlns="http://www.w3.org/2000/svg" width="300" height="700" viewBox="0 0 300 700" role="img" aria-labelledby="title">
<title id="title">Map and Regions — hanging archive plaque suspended from a traditional Chinese ruyi cloud</title>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF4D8"/><stop offset=".6" stop-color="#E8D8B5"/><stop offset="1" stop-color="#CBB58B"/></linearGradient>
 <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#080909"/><stop offset=".5" stop-color="#383838"/><stop offset="1" stop-color="#111212"/></linearGradient>
 <filter id="shadow" x="-30%" y="-20%" width="170%" height="160%"><feDropShadow dx="2" dy="7" stdDeviation="5" flood-color="#151515" flood-opacity=".34"/></filter>
</defs>
<!-- Oversized traditional ruyi auspicious cloud, centered above the hanging chain. -->
<!-- Flowing ruyi cloud scrollwork with long ornamental curls and a centered suspension point. -->
<!-- Traditional Chinese ruyi cloud rendered as airy scrolls, not a solid scalloped bun. -->
