<svg xmlns="http://www.w3.org/2000/svg" width="300" height="700" viewBox="0 0 300 700" role="img" aria-labelledby="title">
<title id="title">Map and Regions — hanging archive plaque suspended from a traditional Chinese ruyi cloud</title>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF4D8"/><stop offset=".6" stop-color="#E8D8B5"/><stop offset="1" stop-color="#CBB58B"/></linearGradient>
 <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#080909"/><stop offset=".5" stop-color="#383838"/><stop offset="1" stop-color="#111212"/></linearGradient>
 <filter id="shadow" x="-30%" y="-20%" width="170%" height="160%"><feDropShadow dx="2" dy="7" stdDeviation="5" flood-color="#151515" flood-opacity=".34"/></filter>
</defs>
<!-- Fuller, layered Chinese cloud-scroll ornament with raised cloud lobes, dense curls, and trailing vapor ribbons. -->
<g stroke-linecap="round" stroke-linejoin="round">
 <!-- Dense outer body: overlapping cloud lobes create volume rather than a thin outline. -->
 <path d="M14 66
 C4 62 5 50 14 45 C19 42 25 44 29 49
 C24 37 31 26 42 24 C52 22 60 29 61 39
 C62 26 73 17 85 19 C98 21 104 31 100 43
 C106 32 118 29 128 35 C138 41 139 51 132 59
 C144 53 156 57 163 65 C174 75 189 72 207 60
 C198 76 184 87 167 87 C153 87 142 79 129 81
 C116 84 108 92 94 89 C82 87 75 78 64 78
 C53 78 45 86 33 80 C24 76 19 71 14 66 Z"
 fill="#171513" stroke="#B66D2C" stroke-width="3.5"/>
 <!-- Raised highlights follow the lobes to make the cloud feel carved and layered. -->
 <path d="M17 61 C10 56 14 48 21 49 C27 50 28 56 23 59
 M36 45 C30 35 39 28 47 30 C56 32 58 40 52 46 C48 50 43 46 46 42
 M66 41 C61 31 70 23 80 25 C90 27 93 36 87 42 C83 47 77 43 80 39
 M105 51 C108 42 119 39 126 45 C132 51 127 59 121 59 C116 59 114 54 118 52"
 fill="none" stroke="#F0C77F" stroke-width="2.6"/>
 <!-- Filled scroll cores add density between the large cloud heads. -->
 <path d="M29 65 C36 54 48 54 54 63 C60 72 51 78 44 73 C39 70 43 65 47 68
 M59 61 C67 51 79 52 84 61 C89 70 81 75 75 71 C71 68 75 64 78 67
 M91 62 C99 53 111 56 115 65 C119 74 110 78 104 73 C100 70 104 66 107 69"
 fill="none" stroke="#C77A43" stroke-width="3"/>
 <!-- Long, layered wind tails: flowing ribbons retain the reference's horizontal sweep. -->
 <path d="M38 72 C51 80 61 72 72 68 C84 63 94 68 105 75
 C118 83 131 78 144 72 C160 65 176 75 192 72
 M49 80 C63 87 75 81 86 77 C98 73 108 79 120 84
 C133 90 147 86 160 81
 M157 51 C168 40 183 43 188 51 C193 59 186 65 180 61
 C176 58 180 54 183 57
 M171 68 C185 61 199 64 210 59 C204 71 194 76 182 75"
 fill="none" stroke="#B66D2C" stroke-width="2.4"/>
 <!-- Central jewel is the actual visual anchor for the hanging chain. -->
 <path d="M123 76 l7 8 -7 8 -7 -8 Z" fill="#B84D37" stroke="#F0C77F" stroke-width="2"/>
 <circle cx="123" cy="84" r="3" fill="#FFF4D8"/>
</g>
<!-- One thick chain starts inside the cloud, then connects to one nail on the tilted plaque. -->
<g stroke-linecap="round" stroke-linejoin="round">
 <path d="M123 62 L145 181" fill="none" stroke="#080909" stroke-width="14"/>
 <path d="M120 63 L142 179" fill="none" stroke="#777" stroke-width="3"/>
 <g fill="#171717" stroke="#888" stroke-width="2">
  <ellipse cx="126" cy="78" rx="7" ry="11" transform="rotate(10 126 78)"/>
  <ellipse cx="130" cy="97" rx="7" ry="11" transform="rotate(10 130 97)"/>
  <ellipse cx="133" cy="116" rx="7" ry="11" transform="rotate(10 133 116)"/>
  <ellipse cx="137" cy="135" rx="7" ry="11" transform="rotate(10 137 135)"/>
  <ellipse cx="140" cy="154" rx="7" ry="11" transform="rotate(10 140 154)"/>
  <ellipse cx="144" cy="173" rx="7" ry="11" transform="rotate(10 144 173)"/>
 </g>
 <circle cx="145" cy="181" r="9" fill="#171717" stroke="#B84D48" stroke-width="3"/>
 <path d="M140 177 L150 185 M150 177 L140 185" stroke="#D7B27D" stroke-width="1.5"/>
</g>
<g transform="rotate(4 145 430)" filter="url(#shadow)">
 <path d="M58 179 L229 191 L205 558 L34 546 Z" fill="url(#iron)" stroke="#050505" stroke-width="4"/>
 <path d="M66 188 L220 199 L197 549 L43 538 Z" fill="url(#paper)" stroke="#B84D48" stroke-width="3"/>
 <path d="M75 199 L210 209 L188 537 L53 527 Z" fill="none" stroke="#2A2925" stroke-width="1.4"/>
 <path d="M81 208 L202 218 L180 526 L59 517 Z" fill="none" stroke="#B84D48" stroke-width="1"/>
 <path d="M60 181 L227 193 L225 212 L58 200 Z" fill="#171717" stroke="#B84D48" stroke-width="2"/>
 <circle cx="78" cy="212" r="4" fill="#151515" stroke="#D39A55" stroke-width="1.5"/><circle cx="207" cy="222" r="4" fill="#151515" stroke="#D39A55" stroke-width="1.5"/>
 <circle cx="62" cy="531" r="4" fill="#151515" stroke="#D39A55" stroke-width="1.5"/><circle cx="185" cy="541" r="4" fill="#151515" stroke="#D39A55" stroke-width="1.5"/>
 <circle cx="133" cy="240" r="13" fill="#171717" stroke="#B84D48" stroke-width="3"/><path d="M133 230 V250 M123 240 H143" stroke="#FFF4D8" stroke-width="2"/>
 <text x="133" y="275" fill="#29231B" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" letter-spacing="2.3">MERZKAVA</text>
 <path d="M95 289 L171 294" stroke="#B84D48" stroke-width="2"/>
 <g fill="#171717" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700"><text x="133" y="329">M</text><text x="131" y="357">A</text><text x="129" y="385">P</text></g>
 <path d="M98 401 L165 406" stroke="#B84D48" stroke-width="2"/>
 <g fill="#8B3B2B" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700"><text x="128" y="422">R</text><text x="127" y="439">E</text><text x="126" y="456">G</text><text x="125" y="473">I</text><text x="124" y="490">O</text><text x="123" y="507">N</text><text x="122" y="524">S</text></g>
</g>
</svg>