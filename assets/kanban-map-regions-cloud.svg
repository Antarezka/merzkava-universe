  <ellipse cx="130" cy="97" rx="7" ry="11" transform="rotate(10 130 97)"/>
  <ellipse cx="133" cy="116" rx="7" ry="11" transform="rotate(10 133 116)"/>
  <ellipse cx="137" cy="135" rx="7" ry="11" transform="rotate(10 137 135)"/>
  <ellipse cx="140" cy="154" rx="7" ry="11" transform="rotate(10 140 154)"/>
  <ellipse cx="144" cy="173" rx="7" ry="11" transform="rotate(10 144 173)"/>
 </g>
 <circle cx="145" cy="181" r="9" fill="#171717" stroke="#B84D48" stroke-width="3"/>
 <path d="M140 177 L150 185 M150 177 L140 185" stroke="#D7B27D" stroke-width="1.5"/>
</g>
<g transform="rotate(4 145 430)" filter="url(#shadow)">
 <path d="M58 179 L229 191 L205 558 L34 546 Z" fill="url(#iron)" stroke="#050505" stroke-width="4"/>
 <path d="M66 188 L220 199 L197 549 L43 538 Z" fill="url(#paper)" stroke="#B84D48" stroke-width="3"/>
 <path d="M75 199 L210 209 L188 537 L53 527 Z" fill="none" stroke="#2A2925" stroke-width="1.4"/>
 <path d="M81 208 L202 218 L180 526 L59 517 Z" fill="none" stroke="#B84D48" stroke-width="1"/>
 <path d="M60 181 L227 193 L225 212 L58 200 Z" fill="#171717" stroke="#B84D48" stroke-width="2"/>
 <circle cx="78" cy="212" r="4" fill="#151515" stroke="#D39A55" stroke-width="1.5"/><circle cx="207" cy="222" r="4" fill="#151515" stroke="#D39A55" stroke-width="1.5"/>
 <circle cx="62" cy="531" r="4" fill="#151515" stroke="#D39A55" stroke-width="1.5"/><circle cx="185" cy="541" r="4" fill="#151515" stroke="#D39A55" stroke-width="1.5"/>
 <circle cx="133" cy="240" r="13" fill="#171717" stroke="#B84D48" stroke-width="3"/><path d="M133 230 V250 M123 240 H143" stroke="#FFF4D8" stroke-width="2"/>
 <text x="133" y="275" fill="#29231B" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" letter-spacing="2.3">MERZKAVA</text>
 <path d="M95 289 L171 294" stroke="#B84D48" stroke-width="2"/>
 <g fill="#171717" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700"><text x="133" y="329">M</text><text x="131" y="357">A</text><text x="129" y="385">P</text></g>
 <path d="M98 401 L165 406" stroke="#B84D48" stroke-width="2"/>
 <g fill="#8B3B2B" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700"><text x="128" y="422">R</text><text x="127" y="439">E</text><text x="126" y="456">G</text><text x="125" y="473">I</text><text x="124" y="490">O</text><text x="123" y="507">N</text><text x="122" y="524">S</text></g>
