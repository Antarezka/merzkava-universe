<svg xmlns="http://www.w3.org/2000/svg" width="300" height="680" viewBox="0 0 300 680" role="img" aria-labelledby="title">
<title id="title">Map and Regions — archive plaque suspended from an ancient Chinese ruyi cloud</title>
