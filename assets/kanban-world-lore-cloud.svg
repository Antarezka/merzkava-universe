  <ellipse cx="98" cy="94" rx="7" ry="11" transform="rotate(8 98 94)"/>
  <ellipse cx="101" cy="113" rx="7" ry="11" transform="rotate(-8 101 113)"/>
 </g>
 <circle cx="105" cy="134" r="9" fill="#171717" stroke="#B66D2C" stroke-width="3"/>
 <path d="M100 130 L110 138 M110 130 L100 138" stroke="#D7B27D" stroke-width="1.5"/>
</g>
