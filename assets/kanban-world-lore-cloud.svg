<svg xmlns="http://www.w3.org/2000/svg" width="300" height="500" viewBox="0 0 300 500" role="img" aria-labelledby="title">
<title id="title">World Lore — hanging archive plaque suspended from a traditional Chinese ruyi cloud</title>
