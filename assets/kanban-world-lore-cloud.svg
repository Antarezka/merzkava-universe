<svg xmlns="http://www.w3.org/2000/svg" width="300" height="500" viewBox="0 0 300 500" role="img" aria-labelledby="title">
<title id="title">World Lore — hanging archive plaque suspended from a traditional Chinese ruyi cloud</title>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF4D8"/><stop offset=".6" stop-color="#E8D8B5"/><stop offset="1" stop-color="#CBB58B"/></linearGradient>
 <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#080909"/><stop offset=".5" stop-color="#383838"/><stop offset="1" stop-color="#111212"/></linearGradient>
 <filter id="shadow" x="-30%" y="-20%" width="170%" height="160%"><feDropShadow dx="2" dy="7" stdDeviation="5" flood-color="#151515" flood-opacity=".34"/></filter>
</defs>
<!-- Fuller, layered Chinese cloud-scroll ornament with raised cloud lobes, dense curls, and trailing vapor ribbons. -->
<g stroke-linecap="round" stroke-linejoin="round">
 <!-- Dense outer body: overlapping cloud lobes create volume rather than a thin outline. -->
 <path d="M14 66
 C4 62 5 50 14 45 C19 42 25 44 29 49
 C24 37 31 26 42 24 C52 22 60 29 61 39
 C62 26 73 17 85 19 C98 21 104 31 100 43
 C106 32 118 29 128 35 C138 41 139 51 132 59
 C144 53 156 57 163 65 C174 75 189 72 207 60
 C198 76 184 87 167 87 C153 87 142 79 129 81
 C116 84 108 92 94 89 C82 87 75 78 64 78
 C53 78 45 86 33 80 C24 76 19 71 14 66 Z"
 fill="#171513" stroke="#B66D2C" stroke-width="3.5"/>
 <!-- Raised highlights follow the lobes to make the cloud feel carved and layered. -->
 <path d="M17 61 C10 56 14 48 21 49 C27 50 28 56 23 59
 M36 45 C30 35 39 28 47 30 C56 32 58 40 52 46 C48 50 43 46 46 42
 M66 41 C61 31 70 23 80 25 C90 27 93 36 87 42 C83 47 77 43 80 39
 M105 51 C108 42 119 39 126 45 C132 51 127 59 121 59 C116 59 114 54 118 52"
 fill="none" stroke="#F0C77F" stroke-width="2.6"/>
 <!-- Filled scroll cores add density between the large cloud heads. -->
 <path d="M29 65 C36 54 48 54 54 63 C60 72 51 78 44 73 C39 70 43 65 47 68
 M59 61 C67 51 79 52 84 61 C89 70 81 75 75 71 C71 68 75 64 78 67
 M91 62 C99 53 111 56 115 65 C119 74 110 78 104 73 C100 70 104 66 107 69"
 fill="none" stroke="#D49A52" stroke-width="3"/>
 <!-- Long, layered wind tails: flowing ribbons retain the reference's horizontal sweep. -->
 <path d="M38 72 C51 80 61 72 72 68 C84 63 94 68 105 75
 C118 83 131 78 144 72 C160 65 176 75 192 72
 M49 80 C63 87 75 81 86 77 C98 73 108 79 120 84
 C133 90 147 86 160 81
 M157 51 C168 40 183 43 188 51 C193 59 186 65 180 61
 C176 58 180 54 183 57
 M171 68 C185 61 199 64 210 59 C204 71 194 76 182 75"
 fill="none" stroke="#B66D2C" stroke-width="2.4"/>
 <!-- Central jewel is the actual visual anchor for the hanging chain. -->
 <path d="M94 76 l7 8 -7 8 -7 -8 Z" fill="#B84D37" stroke="#F0C77F" stroke-width="2"/>
 <circle cx="94" cy="84" r="3" fill="#FFF4D8"/>
</g>
<!-- One single thick chain, visibly emerging from the cloud and ending at one nail. -->
<g stroke-linecap="round" stroke-linejoin="round">
 <path d="M94 61 L105 133" fill="none" stroke="#080909" stroke-width="14"/>
 <path d="M91 62 L102 132" fill="none" stroke="#777" stroke-width="3"/>
 <g fill="#171717" stroke="#888" stroke-width="2">
  <ellipse cx="96" cy="75" rx="7" ry="11" transform="rotate(-8 96 75)"/>
  <ellipse cx="98" cy="94" rx="7" ry="11" transform="rotate(8 98 94)"/>
  <ellipse cx="101" cy="113" rx="7" ry="11" transform="rotate(-8 101 113)"/>
 </g>
 <circle cx="105" cy="134" r="9" fill="#171717" stroke="#B66D2C" stroke-width="3"/>
 <path d="M100 130 L110 138 M110 130 L100 138" stroke="#D7B27D" stroke-width="1.5"/>
</g>
<g transform="rotate(-2 105 310)" filter="url(#shadow)">
 <path d="M27 135 L178 130 L187 464 L36 469 Z" fill="url(#iron)" stroke="#050505" stroke-width="4"/>
 <path d="M34 143 L171 138 L180 455 L43 460 Z" fill="url(#paper)" stroke="#B66D2C" stroke-width="3"/>
 <path d="M44 153 L161 149 L169 444 L52 448 Z" fill="none" stroke="#2A2925" stroke-width="1.4"/>
 <path d="M50 161 L155 157 L163 436 L58 440 Z" fill="none" stroke="#B66D2C" stroke-width="1"/>
 <path d="M29 137 L177 132 L180 150 L32 155 Z" fill="#171717" stroke="#C68A48" stroke-width="2"/>
 <circle cx="47" cy="167" r="4" fill="#151515" stroke="#D39A55" stroke-width="1.5"/><circle cx="153" cy="163" r="4" fill="#151515" stroke="#D39A55" stroke-width="1.5"/>
 <circle cx="55" cy="435" r="4" fill="#151515" stroke="#D39A55" stroke-width="1.5"/><circle cx="160" cy="431" r="4" fill="#151515" stroke="#D39A55" stroke-width="1.5"/>
 <circle cx="104" cy="187" r="13" fill="#B84D37" stroke="#151515" stroke-width="3"/><path d="M104 177 V197 M94 187 H114" stroke="#FFF4D8" stroke-width="2"/>
 <text x="104" y="222" fill="#29231B" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" letter-spacing="2.3">MERZKAVA</text>
 <path d="M68 236 L140 234" stroke="#B66D2C" stroke-width="2"/>
 <g fill="#171717" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700"><text x="104" y="272">W</text><text x="104" y="299">O</text><text x="104" y="326">R</text><text x="104" y="353">L</text><text x="104" y="380">D</text></g>
 <path d="M72 396 L136 394" stroke="#B66D2C" stroke-width="2"/>
 <g fill="#8B3B2B" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700"><text x="104" y="412">L</text><text x="104" y="429">O</text><text x="104" y="446">R</text><text x="104" y="463">E</text></g>
</g>
</svg>