 <circle cx="104" cy="187" r="13" fill="#B84D37" stroke="#151515" stroke-width="3"/><path d="M104 177 V197 M94 187 H114" stroke="#FFF4D8" stroke-width="2"/>
 <text x="104" y="222" fill="#29231B" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" letter-spacing="2.3">MERZKAVA</text>
