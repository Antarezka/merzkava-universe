 <circle cx="94" cy="59" r="4" fill="#B84D37" stroke="#FFF4D8" stroke-width="1.5"/>
</g>
<!-- One single thick chain, visibly emerging from the cloud and ending at one nail. -->
<g stroke-linecap="round" stroke-linejoin="round">
