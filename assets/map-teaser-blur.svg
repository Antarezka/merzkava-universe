<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Merzkava Universe — frosted geographic world map</title>
<desc id="desc">A stylized geographic silhouette based on the established relative positions of the northern Beiming Gu, eastern Golden Dragon Empire, floating southwestern Tianhai Yunzhou, western Lawless Territories, and connected seas. Deliberately obscured by heavy fogged-glass blur.</desc>
<defs>
  <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172a35"/><stop offset=".55" stop-color="#253b43"/><stop offset="1" stop-color="#171f2a"/></linearGradient>
  <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b58b62"/><stop offset=".5" stop-color="#6e806f"/><stop offset="1" stop-color="#4c6970"/></linearGradient>
  <linearGradient id="north" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8e2e1"/><stop offset="1" stop-color="#879da6"/></linearGradient>
  <linearGradient id="island" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7bd83"/><stop offset="1" stop-color="#a66e55"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".43"/><stop offset=".45" stop-color="#e8f1f2" stop-opacity=".19"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
  <filter id="mapblur"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="mist"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="24"/><feColorMatrix values="1 0 0 0 .7 0 1 0 0 .7 0 0 1 0 .7 0 0 0 .16 0"/></filter>
  <clipPath id="clip"><rect x="18" y="18" width="1164" height="639" rx="28"/></clipPath>
</defs>
<rect width="1200" height="675" fill="url(#ocean)"/>
<g clip-path="url(#clip)">
  <!-- Bathymetry: shallow coastal shelves, deeper open basins; schematic, not surveyed -->
  <g opacity=".98">
    <rect x="18" y="18" width="1164" height="639" fill="#142d3b"/>
    <path d="M18 18 H1182 V180 Q1080 210 1000 178 T820 178 Q760 142 680 160 T520 150 Q430 185 340 150 T18 190Z" fill="#1d4050"/>
    <path d="M18 18 H1182 V105 Q1080 130 980 105 T790 112 Q690 85 580 108 T390 100 Q240 130 18 115Z" fill="#244d5b" opacity=".8"/>
    <path d="M880 150 Q1020 130 1182 175 V480 Q1090 455 1030 420 Q960 380 925 320 Q880 250 880 150Z" fill="#102b3c"/>
    <path d="M900 215 Q1030 190 1182 230 V410 Q1090 395 1035 360 Q965 325 940 275Z" fill="#193d4d"/>
    <path d="M310 355 Q390 365 455 410 Q520 455 620 470 Q740 490 830 450 Q920 420 1010 470 L1120 657 H300 Q360 585 330 520 Q290 445 310 355Z" fill="#102b3d"/>
    <path d="M360 440 Q440 435 510 475 Q600 520 700 505 Q805 485 900 500 Q970 525 1015 585 L980 657 H420 Q475 590 420 535Z" fill="#173b4b"/>
    <path d="M18 390 Q100 410 170 430 Q245 455 330 450 Q390 450 445 490 L500 657 H18Z" fill="#173848"/>
    <path d="M18 480 Q115 475 210 500 Q300 520 365 555 L410 657 H18Z" fill="#214654"/>
    <!-- Distinct southern deep ocean beyond the ordinary Black Tide waters -->
    <path d="M400 560 Q550 530 700 565 Q850 590 1000 555 Q1100 535 1182 560 V657 H390Z" fill="#091d30"/>
    <path d="M540 595 Q700 570 830 600 T1120 590 L1182 657 H500Z" fill="#102b43"/>
    <!-- Shallow continental shelves: broad, irregular pale bands hugging the coasts -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M370 55 L455 42 510 68 574 48 635 73 690 66 735 105 798 112 824 160 875 183 889 235 862 276 885 317 850 356 819 394 783 422 750 469 704 478 664 455 619 475 570 453 531 471 490 439 449 423 413 382 379 357 355 311 323 274 335 229 312 193 335 151 345 105Z" stroke="#6aa6a0" stroke-width="66" opacity=".24"/>
      <path d="M125 276 L185 237 246 248 287 283 301 330 273 368 240 403 185 411 136 383 104 337Z" stroke="#6aa6a0" stroke-width="48" opacity=".22"/>
      <path d="M370 55 L455 42 510 68 574 48 635 73 690 66 735 105 798 112 824 160 875 183 889 235 862 276 885 317 850 356 819 394 783 422 750 469 704 478 664 455 619 475 570 453 531 471 490 439 449 423 413 382 379 357 355 311 323 274 335 229 312 193 335 151 345 105Z" stroke="#a0c8b3" stroke-width="24" opacity=".22"/>
      <path d="M125 276 L185 237 246 248 287 283 301 330 273 368 240 403 185 411 136 383 104 337Z" stroke="#a0c8b3" stroke-width="18" opacity=".2"/>
    </g>
    <!-- Bathymetric contours and shelf breaks -->
    <g fill="none" stroke="#83b7b5" stroke-width="3" opacity=".2">
      <path d="M40 210 Q180 170 300 215 T520 210"/>
      <path d="M930 155 Q1030 125 1160 170"/>
      <path d="M875 440 Q980 410 1130 455"/>
      <path d="M455 540 Q600 510 740 545 T1060 540"/>
      <path d="M500 620 Q700 590 900 625 T1180 615"/>
    </g>
  </g>
  <!-- Geographic landmasses: relative placement only, not a surveyed coastline -->
  <g filter="url(#mapblur)">
    <!-- Main continent -->
    <path d="M370 55 L455 42 510 68 574 48 635 73 690 66 735 105 798 112 824 160 875 183 889 235 862 276 885 317 850 356 819 394 783 422 750 469 704 478 664 455 619 475 570 453 531 471 490 439 449 423 413 382 379 357 355 311 323 274 335 229 312 193 335 151 345 105 Z" fill="url(#land)" stroke="#e5c69a" stroke-width="8"/>
    <!-- Northern cold mountain realm -->
    <path d="M400 62 L455 42 510 68 574 48 635 73 690 66 735 105 750 150 711 178 657 166 612 191 562 170 516 190 470 160 425 174 390 133 Z" fill="url(#north)" opacity=".92" stroke="#e9f0ed" stroke-width="7"/>
    <path d="M410 105 L453 73 478 121 510 82 542 139 577 80 604 139 639 96 671 151 709 116 733 157" fill="none" stroke="#f5f4e8" stroke-width="13" opacity=".65"/>
    <!-- Eastern imperial region, broad eastern shoulder of continent -->
    <path d="M680 185 L790 170 858 206 887 251 864 300 881 337 833 387 786 421 741 458 704 435 680 389 702 342 671 302 692 255 Z" fill="#bd9165" opacity=".92" stroke="#f1c18a" stroke-width="7"/>
    <!-- Western/southwestern lawless land -->
    <path d="M125 276 L185 237 246 248 287 283 301 330 273 368 240 403 185 411 136 383 104 337 Z" fill="#8d7062" opacity=".9" stroke="#d4a17d" stroke-width="7"/>
    <!-- Azerion forest / inner lake motif, not a precise route -->
    <path d="M255 286 Q310 260 343 302 Q362 341 327 373 Q289 392 261 362 Q238 331 255 286Z" fill="#476d62" stroke="#b8d1ad" stroke-width="6"/>
    <ellipse cx="301" cy="330" rx="24" ry="17" fill="#78aeb0" opacity=".8"/>
    <!-- Floating Tianhai island over southwest sea -->
    <path d="M450 410 Q492 374 540 391 L582 374 631 399 664 434 642 470 601 484 552 474 509 493 466 469 432 444Z" fill="url(#island)" stroke="#ffe0ae" stroke-width="9"/>
    <path d="M475 427 Q534 394 586 414 T639 444" fill="none" stroke="#fff0d0" stroke-width="7" opacity=".6"/>
    <!-- Far southern polar ocean / island flecks -->
    <path d="M80 540 Q250 504 420 535 T760 534 T1120 535" fill="none" stroke="#91b7c2" stroke-width="18" opacity=".35"/>
    <g fill="#8f7569" stroke="#d6b08a" stroke-width="5">
      <path d="M250 478 l28 -12 22 18 -17 23 -31 -5Z"/>
      <path d="M310 505 l20 -12 19 16 -15 20 -24 -6Z"/>
      <path d="M355 480 l17 -9 17 13 -12 17 -22 -5Z"/>
    </g>
    <!-- Sea channels -->
    <g fill="none" stroke="#9dc4c7" stroke-width="8" opacity=".8">
      <path d="M830 285 Q750 265 690 305 Q642 333 615 390"/>
      <path d="M600 405 Q555 380 505 356 Q450 330 390 333"/>
      <path d="M505 480 Q430 512 355 526 Q280 537 220 505"/>
      <path d="M520 355 Q552 326 591 318 Q634 311 670 332"/>
    </g>
    <!-- Relative region markers and coast contours -->
    <g fill="none" stroke="#f8e4c6" stroke-width="5" opacity=".65">
      <path d="M365 180 Q430 215 490 204 T610 216"/>
      <path d="M680 230 Q760 218 831 257"/>
      <path d="M150 325 Q202 300 260 326"/>
      <path d="M464 438 Q540 450 627 437"/>
    </g>
  </g>

  <!-- broad drifting fog banks -->
  <g filter="url(#mist)" fill="#eef6f2" opacity=".34">
    <ellipse cx="240" cy="120" rx="260" ry="95"/>
    <ellipse cx="680" cy="100" rx="310" ry="110"/>
    <ellipse cx="1000" cy="280" rx="280" ry="130"/>
    <ellipse cx="300" cy="430" rx="300" ry="115"/>
    <ellipse cx="790" cy="550" rx="380" ry="100"/>
  </g>
  <rect width="1200" height="675" fill="url(#glass)"/>
  <rect width="1200" height="675" filter="url(#noise)" opacity=".5"/>
  <g fill="#fff" opacity=".16" filter="url(#glow)">
    <ellipse cx="170" cy="90" rx="120" ry="60"/><ellipse cx="970" cy="145" rx="180" ry="72"/>
    <ellipse cx="430" cy="570" rx="220" ry="60"/><ellipse cx="900" cy="480" rx="200" ry="65"/>
  </g>
  <g fill="#fff" opacity=".23">
    <circle cx="91" cy="130" r="5"/><circle cx="112" cy="151" r="2.5"/><circle cx="1082" cy="103" r="5"/>
    <circle cx="1058" cy="128" r="2.5"/><circle cx="976" cy="560" r="4"/><circle cx="1000" cy="545" r="2"/>
    <circle cx="208" cy="526" r="4"/><circle cx="232" cy="541" r="2"/><circle cx="735" cy="82" r="3"/>
  </g>
  <rect x="19" y="19" width="1162" height="637" rx="27" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
  <rect x="29" y="29" width="1142" height="617" rx="22" fill="none" stroke="#ffc78e" stroke-opacity=".48" stroke-width="1.5"/>
</g>
<g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
  <text x="600" y="285" fill="#ffe6bd" font-size="19" font-weight="600" letter-spacing="8">MERZKAVA UNIVERSE</text>
  <text x="600" y="356" fill="#fff" font-size="58" font-weight="700" letter-spacing="2">CLICK TO REVEAL</text>
  <path d="M566 395 L600 426 L634 395" fill="none" stroke="#ffc17e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="478" fill="#fff5e8" font-size="17" letter-spacing="4" opacity=".9">A WORLD HIDDEN BENEATH THE MIST</text>
</g>
</svg>