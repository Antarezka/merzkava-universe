<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Merzkava Universe — sealed world navigation map</title>
  <desc id="desc">A heavily misted, frosted-glass preview of the connected world tree: three major powers, outer territories, seas, and inter-power transit corridors.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17232a"/>
      <stop offset=".48" stop-color="#34302b"/>
      <stop offset="1" stop-color="#17191d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".38" stop-color="#dce8eb" stop-opacity=".17"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6a3"/>
      <stop offset="1" stop-color="#e88b49"/>
    </linearGradient>
    <filter id="deep-mist" x="-15%" y="-20%" width="130%" height="140%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="soft-mist" x="-10%" y="-15%" width="120%" height="130%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="18"/>
      <feColorMatrix values="1 0 0 0 .7  0 1 0 0 .7  0 0 1 0 .7  0 0 0 .18 0"/>
    </filter>
    <clipPath id="frame"><rect x="18" y="18" width="1164" height="639" rx="28"/></clipPath>
  </defs>

  <rect width="1200" height="675" fill="url(#base)"/>
  <g clip-path="url(#frame)">
    <path d="M-40 170 C160 30 270 260 430 150 S720 30 870 170 S1100 270 1260 100" fill="none" stroke="#9fc1c2" stroke-width="80" opacity=".13" filter="url(#glow)"/>
    <path d="M-30 520 C150 390 280 620 450 500 S760 390 910 520 S1110 610 1250 450" fill="none" stroke="#e8a46b" stroke-width="70" opacity=".12" filter="url(#glow)"/>

    <!-- Connected world-tree silhouette, intentionally softened behind the glass -->
    <g filter="url(#deep-mist)" opacity=".95" stroke-linecap="round" stroke-linejoin="round">
      <path d="M600 115 V205 M600 205 L260 300 M600 205 L600 300 M600 205 L940 300" fill="none" stroke="#f3c27e" stroke-width="17"/>
      <path d="M260 300 V375 M600 300 V375 M940 300 V375" fill="none" stroke="#e7e0c9" stroke-width="12"/>
      <path d="M260 375 L110 475 M260 375 L260 475 M260 375 L410 475" fill="none" stroke="#e6a66f" stroke-width="10"/>
      <path d="M600 375 L510 475 M600 375 L600 475 M600 375 L690 475" fill="none" stroke="#8fc4ca" stroke-width="10"/>
      <path d="M940 375 L790 475 M940 375 L940 475 M940 375 L1090 475" fill="none" stroke="#b8c7d4" stroke-width="10"/>
      <path d="M110 475 C300 560 430 560 600 535 S900 560 1090 475" fill="none" stroke="#f3c27e" stroke-width="11" stroke-dasharray="16 20"/>
      <rect x="420" y="55" width="360" height="100" rx="26" fill="#fff" fill-opacity=".45" stroke="#ffe3b0" stroke-width="8"/>
      <rect x="95" y="255" width="330" height="125" rx="24" fill="#f0a45f" fill-opacity=".45" stroke="#ffe0ad" stroke-width="7"/>
      <rect x="435" y="255" width="330" height="125" rx="24" fill="#80bfc7" fill-opacity=".42" stroke="#d8f4f2" stroke-width="7"/>
      <rect x="775" y="255" width="330" height="125" rx="24" fill="#9caec3" fill-opacity=".42" stroke="#e1e8f0" stroke-width="7"/>
      <rect x="65" y="440" width="190" height="75" rx="18" fill="#e7ad77" fill-opacity=".4"/>
      <rect x="270" y="440" width="190" height="75" rx="18" fill="#e7ad77" fill-opacity=".4"/>
      <rect x="505" y="440" width="190" height="75" rx="18" fill="#85c1c7" fill-opacity=".4"/>
      <rect x="740" y="440" width="190" height="75" rx="18" fill="#a8b8c8" fill-opacity=".4"/>
      <rect x="945" y="440" width="190" height="75" rx="18" fill="#a8b8c8" fill-opacity=".4"/>
    </g>

    <!-- Softly legible geography cues -->
    <g filter="url(#soft-mist)" fill="none" stroke="#fff2d9" opacity=".42">
      <path d="M95 205 Q190 145 300 205 T510 205 T720 205 T930 205 T1140 205" stroke-width="3"/>
      <path d="M80 565 Q230 510 380 565 T680 565 T980 565 T1220 565" stroke-width="4"/>
      <circle cx="600" cy="205" r="76" stroke-width="4"/>
      <circle cx="260" cy="375" r="58" stroke-width="3"/>
      <circle cx="600" cy="375" r="58" stroke-width="3"/>
      <circle cx="940" cy="375" r="58" stroke-width="3"/>
    </g>

    <!-- Heavy condensation / fogged-glass veil -->
    <rect width="1200" height="675" fill="url(#glass)"/>
    <rect width="1200" height="675" filter="url(#grain)" opacity=".42"/>
    <g fill="#fff" opacity=".13" filter="url(#soft-mist)">
      <ellipse cx="165" cy="100" rx="190" ry="85"/>
      <ellipse cx="520" cy="80" rx="230" ry="95"/>
      <ellipse cx="1010" cy="155" rx="250" ry="110"/>
      <ellipse cx="330" cy="590" rx="260" ry="90"/>
      <ellipse cx="870" cy="585" rx="300" ry="100"/>
    </g>

    <!-- condensation beads -->
    <g fill="#fff" opacity=".2">
      <circle cx="83" cy="126" r="5"/><circle cx="118" cy="145" r="2.5"/>
      <circle cx="1090" cy="100" r="6"/><circle cx="1055" cy="126" r="3"/>
      <circle cx="980" cy="560" r="5"/><circle cx="1010" cy="545" r="2.5"/>
      <circle cx="205" cy="535" r="4"/><circle cx="230" cy="550" r="2"/>
      <circle cx="735" cy="90" r="3.5"/><circle cx="760" cy="110" r="2"/>
    </g>

    <rect x="19" y="19" width="1162" height="637" rx="27" fill="none" stroke="#fff" stroke-opacity=".52" stroke-width="2"/>
    <rect x="29" y="29" width="1142" height="617" rx="22" fill="none" stroke="#ffcc91" stroke-opacity=".48" stroke-width="1.5"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="600" y="285" fill="#ffe6bd" font-size="20" font-weight="600" letter-spacing="8" opacity=".92">MERZKAVA UNIVERSE</text>
    <text x="600" y="356" fill="#fff" font-size="58" font-weight="700" letter-spacing="2">CLICK TO REVEAL</text>
    <path d="M566 395 L600 426 L634 395" fill="none" stroke="#ffc17e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="600" y="478" fill="#fff5e8" font-size="17" letter-spacing="4" opacity=".88">THREE POWERS · ONE CONNECTED WORLD</text>
  </g>
</svg>