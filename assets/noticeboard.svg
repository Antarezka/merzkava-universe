<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">Merzkava Universe — Investigation Board</title>
<desc id="desc">A detective-style cork investigation board with photographs, dossiers, maps, handwritten notes, evidence tags and red strings. The investigation is divided evenly between Spirit Realm and Arcanistry, with verified connections across Merzkava's history, powers, institutions, artifacts and mysteries.</desc>
