<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1120" viewBox="0 0 960 1120" role="img" aria-labelledby="title desc">
  <rect width="960" height="1120" fill="#0D1117"/>
  <title id="title">Merzkava Universe — The Noticeboard</title>
  <desc id="desc">Six framed panels introducing Merzkava's three powers, hidden territories, consequential choices, Thinkers and Artificial Artifacts, a living world, and the difference between rumor and fact.</desc>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="34" y="28" width="892" height="94" rx="3" fill="#151515"/>
    <path d="M34 28H926V122H34Z" fill="none" stroke="#FFB36B" stroke-width="4"/>
    <text x="62" y="61" fill="#FFFFFF" font-size="17" font-weight="700" letter-spacing="3">MERZKAVA UNIVERSE / FIELD NOTES</text>
    <text x="62" y="99" fill="#FFFFFF" font-size="32" font-weight="900" letter-spacing="1">THE NOTICEBOARD</text>

    <rect x="34" y="145" width="892" height="224" rx="3" fill="#FFB36B"/>
    <rect x="34" y="145" width="892" height="48" fill="#151515"/>
    <path d="M34 145H926V369H34Z" fill="none" stroke="#151515" stroke-width="4"/>
    <text x="58" y="176" fill="#FFFFFF" font-size="18" font-weight="700" letter-spacing="1.5">01 / THREE GREAT POWERS</text>
    <text x="60" y="235" fill="#151515" font-size="34" font-weight="900">THREE POWERS.</text>
    <text x="60" y="276" fill="#151515" font-size="34" font-weight="900">THREE WAYS TO RISE.</text>
    <text x="60" y="322" fill="#151515" font-size="19">Martial Souls, Spirit Rings, and rival ambitions shape the world.</text>

    <rect x="34" y="393" width="426" height="202" rx="3" fill="#FFE066"/>
    <rect x="34" y="393" width="426" height="44" fill="#151515"/>
    <path d="M34 393H460V595H34Z" fill="none" stroke="#151515" stroke-width="4"/>
    <text x="54" y="422" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="1">02 / BEYOND THE KNOWN WORLD</text>
    <text x="56" y="476" fill="#151515" font-size="23" font-weight="900">RUINS KEEP</text>
    <text x="56" y="505" fill="#151515" font-size="23" font-weight="900">OLD SECRETS.</text>
    <text x="56" y="548" fill="#151515" font-size="16">Hidden factions. Dangerous routes. Uncharted places.</text>

    <rect x="482" y="393" width="444" height="202" rx="3" fill="#F25C54"/>
    <rect x="482" y="393" width="444" height="44" fill="#151515"/>
    <path d="M482 393H926V595H482Z" fill="none" stroke="#151515" stroke-width="4"/>
    <text x="502" y="422" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="1">03 / CHOICES HAVE CONSEQUENCES</text>
    <text x="504" y="476" fill="#151515" font-size="25" font-weight="900">POWER CAN</text>
    <text x="504" y="506" fill="#151515" font-size="25" font-weight="900">COST YOU.</text>
    <text x="504" y="548" fill="#151515" font-size="16">Your strength won't erase every consequence.</text>

    
    <rect x="34" y="619" width="892" height="156" fill="#FFFFFF"/>
    <rect x="34" y="619" width="892" height="43" fill="#FFB36B"/>
    <path d="M34 619H926V775H34Z" fill="none" stroke="#151515" stroke-width="4"/>
    <text x="58" y="647" fill="#151515" font-size="17" font-weight="800" letter-spacing="1.2">04 / THINKERS & ARTIFICIAL ARTIFACTS</text>
    <text x="58" y="706" fill="#151515" font-size="27" font-weight="900">NOT EVERY PATH TO POWER BEGINS WITH CULTIVATION.</text>
    <text x="58" y="744" fill="#151515" font-size="18">Thinkers shape knowledge, formulations, and artifacts through skill.</text>

    <rect x="34" y="799" width="546" height="182" rx="3" fill="#FFB36B"/>
    <rect x="34" y="799" width="546" height="43" fill="#151515"/>
    <path d="M34 799H580V981H34Z" fill="none" stroke="#151515" stroke-width="4"/>
    <text x="56" y="827" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="1">05 / A LIVING WORLD</text>
    <text x="56" y="881" fill="#151515" font-size="26" font-weight="900">THE WORLD</text>
    <text x="56" y="912" fill="#151515" font-size="26" font-weight="900">KEEPS MOVING.</text>
    <text x="56" y="950" fill="#151515" font-size="16">Trade, festivals, NPC agendas, and rivalries move on.</text>

    <rect x="602" y="799" width="324" height="182" rx="3" fill="#FFE066"/>
    <rect x="602" y="799" width="324" height="43" fill="#151515"/>
    <path d="M602 799H926V981H602Z" fill="none" stroke="#151515" stroke-width="4"/>
    <text x="622" y="827" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="1">06 / FOLLOW THE EVIDENCE</text>
    <text x="622" y="881" fill="#151515" font-size="26" font-weight="900">RUMORS</text>
    <text x="622" y="912" fill="#151515" font-size="26" font-weight="900">AREN'T FACTS</text>
    <text x="622" y="950" fill="#151515" font-size="16">Discover the truth; don't assume it.</text>

    <rect x="34" y="1005" width="892" height="83" rx="3" fill="#151515"/>
    <path d="M34 1005H926V1088H34Z" fill="none" stroke="#F25C54" stroke-width="4"/>
    <text x="58" y="1040" fill="#FFFFFF" font-size="17" font-weight="800" letter-spacing="2">LOOK CLOSER</text>
    <text x="58" y="1067" fill="#FFFFFF" font-size="20" font-weight="900">YOUR NEXT CLUE IS IN THE WORLD ARCHIVE →</text>
  </g>
</svg>